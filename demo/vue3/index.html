<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>vue-fireworks 0.4.1 引擎测试</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
  #stage { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 120%, #1b2a5e 0%, transparent 60%), linear-gradient(180deg,#05060f,#0a1030 60%,#05060f); }
  canvas { width: 100%; height: 100%; display: block; }
  .panel {
    position: fixed; top: 16px; left: 16px; z-index: 20; width: 272px;
    background: rgba(12,18,40,.82); backdrop-filter: blur(10px);
    border: 1px solid rgba(120,150,220,.25); border-radius: 14px; padding: 16px;
    color: #dce6ff; box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  .panel h2 { margin: 0 0 4px; font-size: 15px; letter-spacing: .5px; }
  .panel .ver { font-size: 11px; color: #7f93c4; margin-bottom: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 9px 0; font-size: 12px; }
  .row label { color: #a9b8dd; }
  .colors { margin: 10px 0 4px; }
  .colors .lbl { font-size: 12px; color: #a9b8dd; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .swatches { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .swatches input[type=color] { width: 30px; height: 30px; padding: 0; border: 1px solid #4456a0; border-radius: 6px; background: none; cursor: pointer; }
  .swatches button { width: 24px; height: 24px; border-radius: 6px; border: 1px dashed #4456a0; background: #1b2550; color: #9fb4ee; cursor: pointer; font-size: 14px; line-height: 1; }
  .presets { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .presets button { padding: 3px 7px; font-size: 10px; border: 1px solid #33427a; border-radius: 5px; background: #16204a; color: #a9b8dd; cursor: pointer; }
  .presets button.on { background: #2b3a78; color: #fff; border-color: #5a6ec0; }
  select, input[type=range] { background: #1b2550; color: #dce6ff; border: 1px solid #33427a; border-radius: 6px; }
  select { padding: 3px 6px; font-size: 12px; }
  input[type=range] { width: 110px; }
  .val { font-size: 11px; color: #ffce8a; width: 26px; text-align: right; }
  .fire {
    width: 100%; margin-top: 12px; padding: 11px; border: none; border-radius: 9px;
    background: linear-gradient(135deg,#ff7a45,#ff3d6e); color: #fff; font-weight: 700;
    font-size: 13px; cursor: pointer; box-shadow: 0 8px 22px rgba(255,80,110,.4);
  }
  .fire:active { transform: scale(.98); }
  .tip { margin-top: 10px; font-size: 10px; color: #6c7ba6; line-height: 1.5; }
  .badge { display:inline-block; padding:1px 6px; border-radius:4px; background:#24305e; color:#9fb4ee; font-size:10px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="panel">
  <h2>🎆 vue-fireworks 0.4.1</h2>
  <div class="ver">纯引擎测试 · <span class="badge" id="mode">center</span></div>
  <div class="row"><label>形状</label><select id="shape"><option value="rect">方块 rect</option><option value="circle">圆形 circle</option><option value="star">星形 star</option></select></div>
  <div class="row"><label>粒子数</label><input type="range" id="count" min="20" max="200" value="80"><span class="val" id="countV">80</span></div>
  <div class="row"><label>连发朵数</label><input type="range" id="bursts" min="1" max="20" value="1"><span class="val" id="burstsV">1</span></div>
  <div class="row"><label>间隔(ms)</label><input type="range" id="burstInterval" min="80" max="1000" step="20" value="280"><span class="val" id="burstIntervalV">280</span></div>
  <div class="row"><label>循环连放</label><input type="checkbox" id="loop"></div>
  <div class="row"><label>发射过程</label><input type="checkbox" id="launch"></div>
  <div class="row"><label>升空时长</label><input type="range" id="launchDuration" min="200" max="1200" step="50" value="500"><span class="val" id="launchDurationV">500</span></div>
  <div class="row"><label>爆炸力度</label><input type="range" id="spread" min="2" max="12" value="6"><span class="val" id="spreadV">6</span></div>
  <div class="row"><label>粒子尺寸</label><input type="range" id="size" min="2" max="10" value="4"><span class="val" id="sizeV">4</span></div>
  <div class="row"><label>重力</label><input type="range" id="gravity" min="0" max="40" value="12"><span class="val" id="gravityV">.12</span></div>
  <div class="colors">
    <div class="lbl"><span>粒子颜色</span><span class="val" id="colorCount">3 色</span></div>
    <div class="swatches" id="swatches"></div>
    <div class="presets" id="presets"></div>
  </div>
  <div class="row"><label>拖尾</label><input type="checkbox" id="trail"></div>
  <div class="row"><label>发光</label><input type="checkbox" id="glow" checked></div>
  <div class="row"><label>位置</label><select id="pos"><option value="center">居中</option><option value="top-left">左上固定</option><option value="bottom-right">右下固定</option><option value="mouse">跟随鼠标</option></select></div>
  <button class="fire" id="fire">✦ 放烟花</button>
  <div class="tip" id="tip">点击按钮触发 · 也可在画布任意位置点击绽放<br>色块左键改色 · 右键删除 · 预设一键切换</div>
</div>

<script type="module">
import { FireworksEngine } from '../../dist/engine.js'

const engine = new FireworksEngine(document.getElementById('c'), {
  glow: true, count: 80, shape: 'rect', spread: 6, size: 4, gravity: 0.12
})

const $ = id => document.getElementById(id)
const bind = (id, key, valId, fmt) => {
  const el = $(id)
  el.addEventListener('input', () => {
    let v = el.value
    if (el.type === 'checkbox') v = el.checked
    else if (el.type === 'range') v = Number(v)
    if (valId) $(valId).textContent = fmt ? fmt(v) : v
    engine.setOptions({ [key]: v })
  })
}
bind('shape', 'shape')
bind('count', 'count', 'countV')
bind('bursts', 'bursts', 'burstsV')
bind('burstInterval', 'burstInterval', 'burstIntervalV')
bind('loop', 'loop')
bind('launch', 'launch')
bind('launchDuration', 'launchDuration', 'launchDurationV')
bind('spread', 'spread', 'spreadV')
bind('size', 'size', 'sizeV')
bind('gravity', 'gravity', 'gravityV', v => (v / 100).toFixed(2))
$('gravity').addEventListener('input', e => engine.setOptions({ gravity: Number(e.target.value) / 100 }))
bind('trail', 'trail')
bind('glow', 'glow')

// ---- 颜色配置 ----
const PRESETS = {
  '原版三色': ['#FF8201', '#2DA6E0', '#FF262B'],
  '金粉青': ['#FFD700', '#FF69B4', '#00FFFF'],
  '霓虹': ['#FF00FF', '#00FF9D', '#7B00FF', '#00E5FF'],
  '暖阳': ['#FF6B35', '#FFD23F', '#FF3D6E'],
  '极光': ['#00FFA3', '#3D7BFF', '#B06BFF', '#00E1FF'],
  '单色': ['#FF4D6D']
}
let colors = [...PRESETS['原版三色']]
let activePreset = '原版三色'

function applyColors () {
  engine.setOptions({ colors: [...colors] })
  $('colorCount').textContent = colors.length + ' 色'
  // 重绘色块
  const wrap = $('swatches')
  wrap.innerHTML = ''
  colors.forEach((c, i) => {
    const inp = document.createElement('input')
    inp.type = 'color'
    inp.value = c
    inp.title = c
    inp.addEventListener('input', () => {
      colors[i] = inp.value
      inp.title = inp.value
      activePreset = ''
      syncPresetBtns()
      engine.setOptions({ colors: [...colors] })
    })
    inp.addEventListener('contextmenu', (e) => {
      e.preventDefault()
      if (colors.length > 1) {
        colors.splice(i, 1)
        activePreset = ''
        applyColors()
      }
    })
    wrap.appendChild(inp)
  })
  if (colors.length < 8) {
    const add = document.createElement('button')
    add.textContent = '+'
    add.title = '添加颜色'
    add.addEventListener('click', () => {
      colors.push('#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0'))
      activePreset = ''
      applyColors()
    })
    wrap.appendChild(add)
  }
  if (colors.length > 1) {
    // 删除按钮放在每个色块上（右键删除），提示在 tip
  }
  syncPresetBtns()
}

function syncPresetBtns () {
  document.querySelectorAll('#presets button').forEach(b => {
    b.classList.toggle('on', b.dataset.name === activePreset)
  })
}

const presetsWrap = $('presets')
Object.keys(PRESETS).forEach(name => {
  const b = document.createElement('button')
  b.textContent = name
  b.dataset.name = name
  b.addEventListener('click', () => {
    colors = [...PRESETS[name]]
    activePreset = name
    applyColors()
  })
  presetsWrap.appendChild(b)
})
applyColors()

let posMode = 'center'
$('pos').addEventListener('change', e => {
  posMode = e.target.value
  $('mode').textContent = posMode
  if (posMode === 'mouse') {
    engine.setOptions({ followMouse: true })
    $('tip').textContent = '移动鼠标选择位置，点击按钮或画布绽放'
  } else {
    engine.setOptions({ followMouse: false })
    const origins = {
      center: 'center',
      'top-left': { x: 380, y: 160 },
      'bottom-right': { x: window.innerWidth - 220, y: window.innerHeight - 160 }
    }
    engine.setOptions({ origin: origins[posMode] })
    $('tip').textContent = posMode === 'center' ? '点击按钮触发 · 也可在画布任意位置点击绽放' : '固定位置绽放已启用'
  }
})

// 点击画布 = 单朵定位绽放；按钮 = 遵循面板的连发/循环配置
const doFire = (pt) => engine.fire(pt ? { origin: pt, followMouse: false, bursts: 1, loop: false } : {})
$('fire').addEventListener('click', () => doFire())
$('c').addEventListener('click', e => doFire({ x: e.clientX, y: e.clientY }))

// 首屏自动放一次
setTimeout(() => doFire(), 500)
window.__engine = engine
</script>
</body>
</html>
